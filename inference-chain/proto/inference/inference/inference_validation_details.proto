syntax = "proto3";
package inference.inference;

option go_package = "github.com/productscience/inference/x/inference/types";

// Token with its log probability from vLLM top-k logprobs
message TokenLogprob {
  string token = 1;
  double logprob = 2;
}

// Top-k logprobs for a single token position in the generated sequence
message PositionLogprobs {
  repeated TokenLogprob top_k = 1;  // Top-k tokens with logprobs (from vLLM)
  string chosen_token = 2;          // Actually chosen/generated token
}

message InferenceValidationDetails {
  uint64 epoch_id = 1; // The ID of the epoch!
  string inference_id = 2;
  string executor_id = 3;
  int32 executor_reputation = 4;
  uint64 traffic_basis = 5;
  uint64 executor_power = 6;
  string model = 7;
  uint64 total_power = 8;
  int64 created_at_block_height = 9; // Should be the same as block_finished for the inference
  
  // Top-k logprobs data for Stage-1 Sequence Check validation
  // Populated from vLLM response: choices[].logprobs.content[].top_logprobs[]
  repeated PositionLogprobs positions = 10;
}
